<!doctype html>
<html lang="es" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Estudio de desarrollo de software. Desarrollamos páginas web, tiendas online y soluciones digitales adaptadas a las necesidades reales de tu negocio."
    />
    <meta name="theme-color" content="#ffffff" />
    <title>Codo Code — Software pensado codo a codo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script>
      ;(function () {
        try {
          var s = localStorage.getItem('codocode-theme')
          if (!s) {
            s = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          }
          document.documentElement.setAttribute('data-theme', s)
          var meta = document.querySelector('meta[name="theme-color"]')
          if (meta) meta.setAttribute('content', s === 'dark' ? '#0b1524' : '#ffffff')
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
